{% extends 'base.html' %}

{% block title %}{{ title }} - Smart Inventory{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-start mb-4">
    <div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a href="{% url 'category_list' %}">Categories</a></li>
                <li class="breadcrumb-item active">{{ title }}</li>
            </ol>
        </nav>
        <h1 class="page-title">{{ title }}</h1>
    </div>
    <a href="{% url 'category_list' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left me-2"></i>Back
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-medium">Category Name <span class="text-danger">*</span></label>
                        {{ form.name }}
                        {% if form.name.errors %}
                        <div class="text-danger small mt-1">{{ form.name.errors.0 }}</div>
                        {% endif %}
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium">Description</label>
                        {{ form.description }}
                    </div>
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle me-2"></i>Save Category
                        </button>
                        <a href="{% url 'category_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
